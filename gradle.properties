# Enable AndroidX support for Jetpack Compose and libraries
android.useAndroidX=true

# JVM arguments for Gradle build daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Suppress compileSdk 35 warning for AGP 8.5.0
android.suppressUnsupportedCompileSdk=35

# Non-transitive R classes for faster build performance
android.nonTransitiveRClass=true

# Kotlin code style
kotlin.code.style=official
